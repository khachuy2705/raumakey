# Boundaries (after + space is the A15 vector). A word whose tone was undone is no longer
# transformed, so it is not restored (design §20.9).

[[vector]]
id = "golden-boundary-windows"
evidence = ["baseline"]
source = "crates/raumakey-engine/tests/golden.rs::boundary_golden_vectors"
method = "telex"
keys = "windows{SPACE}"
text = "windows "

[[vector]]
id = "golden-boundary-class"
evidence = ["baseline"]
source = "crates/raumakey-engine/tests/golden.rs::boundary_golden_vectors"
method = "telex"
keys = "class{SPACE}"
text = "class "

[[vector]]
id = "golden-boundary-tesst"
evidence = ["baseline", "raumakey-decision"]
decisions = ["design §20.9"]
source = "crates/raumakey-engine/tests/golden.rs::boundary_golden_vectors"
