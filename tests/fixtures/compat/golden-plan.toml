# Golden vectors of plan §3.10, transcribed from crates/raumakey-engine/tests/golden.rs. Schema
# and evidence rules: raumakey_tests::vectors. Defaults v1 (Telex) unless a vector says
# otherwise.
#
# Golden vectors with the same setup as a matrix vector are not repeated here: aa, dd, as, ass,
# aaa, quas, gias, VIEETJ, hoafn (both styles), thuyr (both styles), after + space (Telex), and
# \' (VIQR) are in matrix-a-engine.toml and matrix-b-modifiers.toml.
# tests/compat_vectors.rs checks that every plan §3.10 vector has a fixture.
schema_version = 1

