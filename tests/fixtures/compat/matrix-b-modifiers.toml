# Matrix rows B21–B23 and B29 (modifiers and secure fields) of
# docs/reference/evkey_compatibility_test_matrix.md, transcribed from
# crates/raumakey-engine/tests/matrix.rs and, for B29, which the adapter's policy decides (D25),
# from tests/src/vectors/tests.rs. Schema and evidence rules: raumakey_tests::vectors.
#
# Not transcribed, because no key script expresses them: shortcuts with Alt or Win and the
# Alt+Enter and hard-reset separators of B21, Caps Lock in B23, and the source's checks that a
# shortcut or a secure field never looks up a macro.
schema_version = 1

# B21: a Ctrl shortcut bypasses the engine and resets it; the next word starts fresh.

[[vector]]
id = "b21-ctrl-shortcut-passes-reset"
rows = ["B21"]
evidence = ["baseline"]
source = "crates/raumakey-engine/tests/matrix.rs::b21_shortcuts_bypass_the_engine_and_reset"
method = "telex"
keys = "a{CTRL+c}a"
transactions = [
    'Tx(0,"",false,None,false)',
    'Tx(0,"",false,None,true)',
    'Tx(0,"",false,None,false)',
]
text = "aa"

