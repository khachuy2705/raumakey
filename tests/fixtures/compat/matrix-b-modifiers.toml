# B29 (D25): the policy's secure-field mode decides, and the executor applies it before the
# engine as the TIP does. In the default `bypass` mode every key of a secure field passes
# through with a reset (transform, macros, and backspace history are bypassed); after the field
# Telex works again. Transcribed from tests/src/vectors/tests.rs, the executor's tests.

[[vector]]
id = "b29-secure-field-bypasses-all"
rows = ["B29"]
evidence = ["proposed", "raumakey-decision"]
decisions = ["D25"]
source = "tests/src/vectors/tests.rs::b29_secure_fields_bypass_everything"
method = "telex"
macros = [{ trigger = "ko", replacement = "không" }]
keys = "{SECURE}aas ko{SPACE}{BS}{/SECURE}aa"
steps = [
    { index = 0, transaction = 'Tx(0,"",false,None,true)' },
    { index = 1, transaction = 'Tx(0,"",false,None,true)' },
    { index = 2, transaction = 'Tx(0,"",false,None,true)' },
    { index = 3, transaction = 'Tx(0,"",false,None,true)' },
    { index = 4, transaction = 'Tx(0,"",false,None,true)' },
    { index = 5, transaction = 'Tx(0,"",false,None,true)' },
    { index = 6, transaction = 'Tx(0,"",false,None,true)' },
    { index = 7, transaction = 'Tx(0,"",false,None,true)' },
    { index = 8, transaction = 'Tx(0,"",false,None,true)' },
]
text = "aas koâ"

