# Matrix rows D47–D54 (macros and Unicode) of docs/reference/evkey_compatibility_test_matrix.md,
# transcribed from crates/raumakey-engine/tests/matrix.rs. Schema and evidence rules:
# raumakey_tests::vectors.
#
# The source runs these rows with a macro lookup double; here they run with the real
# raumakey_macro::MacroTable. Its checks of the double's recorded lookups are not transcribed.
# NFD texts are written with \u escapes, never as raw combining marks, which are
# invisible and which an editor that normalizes on save would change (tests/compat_vectors.rs
# checks this). The source asserts that the text is NFD and canonically equivalent to the NFC
# text, and the NFD form is the only such string.
