# A18: 33 keys, then 35 backspaces, with the context limit raised so that the word stays
# owned. Backspaces 1–32 restore the snapshots (the source checks each against the text after
# the matching key; that relation is not transcribed); the oldest snapshot was evicted, so
# backspace 33 falls back to a pass-through with reset (plan §3.9 replaces the matrix's legacy
# op 2 fallback, design §20.5), and the last two pass through.

