id = "a18-history-is-bounded"
rows = ["A18"]
evidence = ["proposed", "raumakey-decision"]
decisions = ["plan §3.9"]
source = "crates/raumakey-engine/tests/matrix.rs::a18_history_is_bounded_and_falls_back_to_pass_through"
