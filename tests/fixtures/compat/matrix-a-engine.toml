keys = """
ddaawbchklmnpqtvbchklmnpqtvbchklm\
{BS}{BS}{BS}{BS}{BS}\
{BS}{BS}{BS}{BS}{BS}\
{BS}{BS}{BS}{BS}{BS}\
{BS}{BS}{BS}{BS}{BS}\
{BS}{BS}{BS}{BS}{BS}\
{BS}{BS}{BS}{BS}{BS}\
{BS}{BS}{BS}{BS}{BS}"""
