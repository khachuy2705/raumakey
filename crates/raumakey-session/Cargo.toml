[package]
name = "raumakey-session"
description = "Raumakey platform-independent session core shared by the TSF text service and the keyboard-hook transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# The EVKey legacy path (clean-room spec §3.1). The core has none yet; the tests that pin
# today's behavior without it depend on this feature.
evkey-compat = ["raumakey-ipc/evkey-compat"]

[dependencies]
raumakey-model.workspace = true
raumakey-engine.workspace = true
raumakey-macro.workspace = true
raumakey-policy.workspace = true
raumakey-ipc.workspace = true

[dev-dependencies]
proptest.workspace = true
