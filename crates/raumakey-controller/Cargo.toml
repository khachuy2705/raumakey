[package]
name = "raumakey-controller"
description = "Raumakey native Win32 controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "raumakey"
path = "src/main.rs"

[features]
default = []
evkey-compat = [
    "raumakey-ipc/evkey-compat",
    "raumakey-session/evkey-compat",
    "raumakey-windows/evkey-compat",
]

[dependencies]
raumakey-model.workspace = true
raumakey-engine.workspace = true
raumakey-macro.workspace = true
raumakey-config.workspace = true
raumakey-policy.workspace = true
raumakey-ipc.workspace = true
raumakey-converter.workspace = true
raumakey-migrate.workspace = true
raumakey-session.workspace = true
raumakey-windows.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core.workspace = true

# `build.rs` embeds the resources and writes the icon group ids of the V and E tray icons into
# `OUT_DIR`, so the program itself does not depend on `raumakey-resources` (plan §1.1).
[build-dependencies]
raumakey-resources.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The tests compare the icon ids that `build.rs` wrote with `raumakey-resources`.
raumakey-resources.workspace = true
