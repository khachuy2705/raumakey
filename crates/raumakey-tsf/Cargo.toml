[package]
name = "raumakey-tsf"
description = "Raumakey COM in-process TSF text input processor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "raumakey_tip"
crate-type = ["cdylib", "rlib"]

[features]
default = []
evkey-compat = ["raumakey-ipc/evkey-compat", "raumakey-windows/evkey-compat"]

[dependencies]
raumakey-model.workspace = true
raumakey-engine.workspace = true
raumakey-macro.workspace = true
raumakey-policy.workspace = true
raumakey-ipc.workspace = true
raumakey-windows.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core.workspace = true

[build-dependencies]
raumakey-resources.workspace = true
